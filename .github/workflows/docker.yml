name: Docker Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-test-env .

      - name: Run tests inside container
        run: docker run my-test-env